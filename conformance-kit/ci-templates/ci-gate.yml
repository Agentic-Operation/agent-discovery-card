# CI gate (stage 2) for agent-instance repos — copy to .github/workflows/ci-gate.yml.
name: ci-gate
on: [pull_request]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema pyyaml pytest
      - run: python conformance-kit/validators/card_validate.py examples/loyalty-agent/card.json
      - run: pytest conformance-kit/test-suites -q
      # triad cross-check when sibling artifacts are present:
      # - run: python conformance-kit/validators/crosscheck.py --profile <profile.json> --bootstrap <bootstrap.yaml> --card examples/loyalty-agent/card.json
