name: ci-gate
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate-spec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install jsonschema pyyaml pytest
      - run: python conformance-kit/validators/card_validate.py examples/loyalty-agent/card.json
      - run: pytest conformance-kit/test-suites -q
